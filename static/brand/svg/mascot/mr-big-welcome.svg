<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="mr-big-welcome-title mr-big-welcome-description">
  <title id="mr-big-welcome-title">Mr. Big · Welcome</title>
  <desc id="mr-big-welcome-description">A compact seated toy cow astronaut raises one round mitten paw in welcome. The cream bean-shaped suit has round teal paws, oval teal boots, and a mustard chest badge with a teal Q. His large black temple patch stays on the viewer’s right and joins that black outer ear. The opposite ear is black; the forehead and fur around both dark button eyes are white.</desc>
