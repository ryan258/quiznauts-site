<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="mr-big-celebrating-title mr-big-celebrating-description">
  <title id="mr-big-celebrating-title">Mr. Big · Celebrating</title>
  <desc id="mr-big-celebrating-description">A compact seated toy cow astronaut raises both round mitten paws in a small delighted cheer. The cream bean-shaped suit has oval teal boots and a mustard chest badge with a teal Q. His large black temple patch stays on the viewer’s right and joins that black outer ear. The opposite ear is black; the forehead and fur around both dark button eyes are white.</desc>
