  <title id="mr-big-avatar-thinking-title">Mr. Big · Thinking</title>
  <desc id="mr-big-avatar-thinking-description">Mr. Big considers a question with a gentle head tilt and one round teal paw resting against the outside of the helmet near his muzzle. His large black temple patch stays on the viewer’s right and joins that black outer ear. The opposite ear is black; the forehead and fur around both dark button eyes are white.</desc>
